
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Показать/скрыть пароль — Лабораторная №5</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <p class="eyebrow">Компонент №15</p>
            <h1>Показать / скрыть пароль</h1>
            <p>Управление видимостью пароля с помощью JavaScript</p>
        </div>
    </header>

    <main class="container demo-page">
        <a href="index.html" class="back-link">
            ← Вернуться к заданиям
        </a>

        <section class="demo-panel">
            <h2>Проверка видимости пароля</h2>
            <p>
                Введите любой тестовый пароль. Нажмите кнопку,
                чтобы увидеть или скрыть введённые символы.
            </p>

            <div class="password-component">
                <label for="demo-password">Пароль</label>

                <div class="password-input-wrapper">
                    <input type="password"
                           id="demo-password"
                           placeholder="Введите тестовый пароль"
                           autocomplete="off">

                    <button type="button"
                            id="password-toggle"
                            class="password-toggle"
                            aria-label="Показать пароль"
                            aria-pressed="false">
                        Показать
                    </button>
                </div>

                <p class="password-status"
                   id="password-status"
                   role="status"
                   aria-live="polite">
                    Пароль скрыт.
                </p>

                <button type="button"
                        class="demo-button password-clear"
                        id="password-clear">
                    Очистить поле
                </button>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Лабораторная работа №5 · Вариант №1 · 2026</p>
    </footer>
</body>
</html>
